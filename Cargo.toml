[package]
name = "unparser-shared"
version = "0.1.0"
edition = "2021"
authors = ["iyulab"]
license = "MIT"
description = "Shared plumbing for the un* document extraction family — C-ABI conventions today; markdown refine and VLM/AI capabilities land as opt-in features"
repository = "https://github.com/iyulab/unparser-shared"
homepage = "https://github.com/iyulab/unparser-shared"
documentation = "https://docs.rs/unparser-shared"
readme = "README.md"
keywords = ["ffi", "c-abi", "error-handling", "document", "extraction"]
categories = ["development-tools::ffi", "api-bindings"]
rust-version = "1.87"

[features]
default = []
# Lossless, idempotent markdown shape-refinement. Off by default so the
# always-linked crate root stays dependency-free; a caller that never
# touches `refine` never pulls in pulldown-cmark.
refine = ["dep:pulldown-cmark", "dep:pulldown-cmark-to-cmark"]

# The crate root (ffi/kind/scaffold) is linked unconditionally by three published
# cdylibs, so it stays dependency-free — a dependency here is a dependency in all
# of them. Optional capabilities (refine, ai) each bring their own dependency
# behind their own feature flag instead.
[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
pulldown-cmark-to-cmark = { version = "22", optional = true }

[dev-dependencies]
proptest = "1"

[[test]]
name = "refine_golden"
path = "tests/refine_golden.rs"
required-features = ["refine"]

[[test]]
name = "refine_roundtrip_properties"
path = "tests/refine_roundtrip_properties.rs"
required-features = ["refine"]

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
